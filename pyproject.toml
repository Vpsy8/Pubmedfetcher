[project]
name = "pubmedfetcher"
version = "0.1.0"
description = "A tool to fetch biopharma and biotech industry affiliated articles based on user defined keywords"
authors = [
    {name = "Vipul Wagh"}
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2.3,<3.0.0",
    "requests>=2.32.3,<3.0.0"
]

[tool.poetry.scripts]
get-papers-list = "pubmedfetcher.myproject:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
